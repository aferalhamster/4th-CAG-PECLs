<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>4th Civil Affairs Group PECLs</title><style>body{margin:auto;max-width:980px;padding:24px;font:16px system-ui;background:#f3f5f8;color:#172033}header{display:flex;gap:20px;align-items:center;border-top:7px solid #9d1720;border-bottom:3px solid #d2a736;padding:18px 0}header img{width:110px;height:110px;object-fit:contain}h1{font:clamp(1.9rem,5vw,3rem) Georgia,serif;margin:0}.level{margin:30px 0}.level h2{border-left:5px solid #9d1720;padding-left:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:14px}.card{display:block;color:inherit;text-decoration:none;background:#fff;border:1px solid #d2d8e0;border-radius:11px;padding:17px;min-height:135px;box-shadow:0 3px 12px #0001}.code{color:#9d1720;font-weight:bold;font-size:.8rem}.card h3{margin:7px 0;font-size:1.05rem}#status{color:#596474}@media(max-width:520px){body{padding:14px}header img{width:75px;height:75px}}</style><header><img src="https://upload.wikimedia.org/wikipedia/commons/2/27/4th_CAG_Insignia_%28transparent_background%29_01.png" alt="4th Civil Affairs Group insignia"><div><h1>4th Civil Affairs Group PECLs</h1><p>Performance Evaluation Checklists</p></div></header><p>Select a checklist below. New PECLs added to <code>PECL.doc</code> will appear automatically after publication.</p><main id=app><p id=status>Loading checklists…</p></main><script>fetch('PECL.doc').then(r=>r.text()).then(t=>{let x=[...t.matchAll(/CMO-PLEX-(\d+):\s*([^\r\n]+)/g)].map(m=>({n:m[1],title:m[2],level:m[1][0]}));if(!x.length)throw Error();app.innerHTML=['2','4','6'].map(l=>{let a=x.filter(z=>z.level===l);if(!a.length)return'';return`<section class=level><h2>Level ${l} PECLs</h2><div class=cards>${a.map(z=>`<a class=card href="level-${l}/?pecl=${z.n}"><span class=code>CMO-PLEX-${z.n}</span><h3>${z.title}</h3><span>Open checklist →</span></a>`).join('')}</div></section>`}).join('')}).catch(()=>status.textContent='Unable to load PECL.doc. Upload it to the same folder as this page.');</script>
