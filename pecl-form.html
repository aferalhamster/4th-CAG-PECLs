<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>PECL</title><style>body{font:16px system-ui;margin:auto;max-width:760px;padding:16px;background:#f5f7fa}header,section{background:white;border:1px solid #ccd3dd;border-radius:10px;padding:16px;margin:12px 0}input,textarea{box-sizing:border-box;width:100%;padding:9px;font:inherit}textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:bold;font-size:.85rem}canvas{width:100%;height:130px;border:2px dashed #789;touch-action:none}button{background:#123d6a;color:white;border:0;border-radius:7px;padding:12px;font-weight:bold}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style><header><h1 id=t>Loading PECL…</h1><p id=c></p><p id=s></p></header><form id=f autocomplete=off><section class=grid><label>Evaluator<input name=evaluator required autocomplete=off></label><label>Date and time<input name=dateTime type=datetime-local required></label><label>Trainee / unit<input name=trainee autocomplete=off></label><label>Location<input name=location></label></section><div id=i></div><section><b>Evaluator signature</b><canvas id=sign></canvas></section><button type=button id=email>Email completed evaluation</button><p id=status></p></form><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>const id=new URLSearchParams(location.search).get('pecl'),ctx=sign.getContext('2d');let d={},ok=false,down=false,last;function sz(){let r=sign.getBoundingClientRect();sign.width=r.width*devicePixelRatio;sign.height=r.height*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}sz();sign.onpointerdown=e=>{down=ok=true;last=pt(e)};sign.onpointermove=e=>{if(down){let p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p}};sign.onpointerup=()=>down=false;function pt(e){let r=sign.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}let n=new Date();n.setMinutes(n.getMinutes()-n.getTimezoneOffset());f.dateTime.value=n.toISOString().slice(0,16);fetch('PECL.doc').then(x=>x.text()).then(x=>{let p=x.split(/(?=CMO-PLEX-\d+:)/).find(z=>z.startsWith('CMO-PLEX-'+id+':'));let a=p.split(/\r?\n/),h=a[0],co=(p.match(/CONDITION:\s*([^\r\n]+)/)||[])[1],st=(p.match(/STANDARD:\s*([^\r\n]+)/)||[])[1],q=[...p.matchAll(/(?:^|\n)\s*\d+\.\s*([^\r\n]+?)\s+YES NO/g)].map(x=>x[1]);d={h,co,st,q};t.textContent=h;c.innerHTML='<b>Condition:</b> '+co;s.innerHTML='<b>Standard:</b> '+st;i.innerHTML=q.map((x,k)=>`<section><b>${k+1}. ${x}</b><p><label><input required type=radio name=x${k} value=Yes> Yes</label><label><input required type=radio name=x${k} value=No> No</label></p><label>Evaluator notes<textarea name=n${k}></textarea></label></section>`).join('')}).catch(()=>status.textContent='Upload PECL.doc to this same GitHub folder.');email.onclick=async()=>{if(!f.reportValidity()||!ok){status.textContent='Complete the form and signature.';return}if(!window.jspdf){status.textContent='PDF tool is loading; try again.';return}let P=new jspdf.jsPDF(),y=42,w=520,put=(x,b=10)=>{P.setFontSize(b);let z=P.splitTextToSize(x,w);if(y+z.length*14>740){P.addPage();y=42}P.text(z,38,y);y+=z.length*14+7};put(d.h,16);put('Evaluator: '+f.evaluator.value+'  Trainee: '+f.trainee.value);put('Date: '+f.dateTime.value);put(d.co);put(d.st);d.q.forEach((x,k)=>{put((k+1)+'. '+x,11);put('Response: '+f['x'+k].value);if(f['n'+k].value)put('Notes: '+f['n'+k].value)});P.addPage();P.text('Evaluator signature:',38,42);P.addImage(sign.toDataURL(),'PNG',38,55,260,100);let file=new File([P.output('blob')],'PECL-'+id+'.pdf',{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Completed '+d.h,text:'Send to 4thCAGPECLs@gmail.com',files:[file]});status.textContent='Choose your email app and send the PDF to 4thCAGPECLs@gmail.com.'}else{let a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();location.href='mailto:4thCAGPECLs@gmail.com?subject='+encodeURIComponent('Completed '+d.h)+'&body=Attach the downloaded PDF before sending.'}}catch(e){}}</script>
