<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PECL Evaluation</title><style>body{margin:0;background:#f4f7fb;color:#172033;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px}header,.card{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:17px;margin:12px 0}header{border-top:6px solid #9d1720}h1{font-size:1.35rem;margin:0 0 8px}h2{font-size:1rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:.8rem;font-weight:700;margin-bottom:5px;text-transform:uppercase}input,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #94a3b8;border-radius:7px;font:inherit}textarea{min-height:75px}.item{font-weight:700}.choice{display:flex;gap:10px;margin:10px 0}.choice label{border:1px solid #cbd5e1;border-radius:7px;padding:10px;flex:1;text-align:center;text-transform:none;font-size:1rem}canvas{width:100%;height:140px;border:2px dashed #94a3b8;border-radius:8px;touch-action:none}button{padding:11px 14px;border:0;border-radius:7px;background:#123d6a;color:#fff;font-weight:700;margin:8px 8px 0 0}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><h1 id="title">Loading PECL…</h1><p id="notice"></p><p id="condition"></p><p id="standard"></p></header><form id="form" autocomplete="off"><section class="card"><div class="grid"><div><label>Evaluator<input name="evaluator" required autocomplete="section-evaluator off"></label></div><div><label>Date and time<input name="dateTime" id="dt" type="datetime-local" required></label></div><div><label>Trainee / unit<input name="trainee" autocomplete="section-trainee off"></label></div><div><label>Location<input name="location"></label></div></div></section><div id="items"></div><section class="card"><h2>Evaluator signature</h2><canvas id="sig"></canvas><button type="button" id="clear">Clear signature</button></section><button>Save completed evaluation</button><button type="button" id="email">Email completed evaluation</button><p id="status"></p></form></main><script>const q=new URLSearchParams(location.search).get('pecl'),notice='The Performance Evaluation Checklist (PECL) generated from training events within the Marine Corps Training Information Management System (MCTIMS) may not always be inclusive. Evaluators must remember when determining whether or not a unit and/or individual is "Trained," "Partially Trained," or "Untrained," that additional actions may be required to facilitate accomplishment of each event component or performance step.';document.querySelector('#notice').textContent=notice;let data={};fetch('PECL.doc').then(r=>r.text()).then(t=>{let parts=t.split(/(?=CMO-PLEX-\d+:)/);let p=parts.find(x=>x.startsWith('CMO-PLEX-'+q+':'));if(!p)throw Error();let lines=p.split(/\r?\n/),head=lines[0],cond=(p.match(/CONDITION:\s*([^\r\n]+)/)||[])[1],std=(p.match(/STANDARD:\s*([^\r\n]+)/)||[])[1],items=[...p.matchAll(/(?:^|\n)\s*(\d+)\.\s*([^\r\n]+?)\s+YES NO/g)].map(x=>x[2]);data={head,cond,std,items};document.title=head;title.textContent=head;condition.innerHTML='<b>Condition:</b> '+cond;standard.innerHTML='<b>Standard:</b> '+std;document.querySelector('#items').innerHTML=items.map((x,i)=>'<section class="card"><p class="item">'+(i+1)+'. '+x+'</p><div class="choice"><label><input required type="radio" name="item'+(i+1)+'" value="Yes"> Yes</label><label><input required type="radio" name="item'+(i+1)+'" value="No"> No</label></div><label>Evaluator notes<textarea name="notes'+(i+1)+'"></textarea></label></section>').join('')}).catch(()=>{title.textContent='PECL source not found';status.textContent='Upload PECL.doc to the same GitHub folder as this form.'});let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());dt.value=d.toISOString().slice(0,16);const c=sig,x=c.getContext('2d');let draw=false,signed=false,last;function size(){let r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=2}size();c.onpointerdown=e=>{draw=signed=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(draw){let p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p}};c.onpointerup=()=>draw=false;function pt(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};clear.onclick=()=>{signed=false;x.clearRect(0,0,c.width,c.height)};function file(){if(!form.reportValidity()||!signed){status.textContent='Complete all responses and add the evaluator signature.';return}let o=Object.fromEntries(new FormData(form));o.pecl=data;o.signature=c.toDataURL();return new File([JSON.stringify(o,null,2)],'PECL-'+q+'.json',{type:'application/json'})}form.onsubmit=e=>{e.preventDefault();let f=file();if(f){let a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();status.textContent='Completed evaluation saved.'}};email.onclick=async()=>{let f=file();if(!f)return;try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:'Completed PECL '+q,files:[f]});else{form.requestSubmit();location.href='mailto:?subject='+encodeURIComponent('Completed PECL '+q)+'&body='+encodeURIComponent('Attach the downloaded evaluation file.')}}catch(e){}};</script></body></html>
